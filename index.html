<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    form{
        display: flex;
        width: 100vw;
        border: 1px solid black;
        padding: 20px;
        text-align: center;
    }
    input[type="number"] {
        width: 100px;
        padding: 10px;
        margin: 5px;
    }
    .isequal {
        font-size: 24px;
        margin: 0 10px;
        position: relative;
        top: 15px;
    }
    button {
        padding: 10px 20px;
        margin: 5px;
        cursor: pointer;
    }
    #result {
        display: inline-block;
        margin: 0 10px;
        font-size: 34px;
        position: relative;
        top: 9px;
    }
    @media (max-width: 600px) {
        form {
            flex-direction: column;
            align-items: center;
        }
        input[type="number"] {
            width: 80%;
        }
        .isequal {
            top: 10px;
        }
        #result {
            top: 5px;
        }
</style>

<body>
    
    <form >
        <input type="number" id="num1" required>
        <h3 id="symbol">+</h3>
        <input type="number" id="num2" required>
        <div class="isequal">=</div>
      
        <h3 id="result"></h3>
        
        <br><br>

        <button type="button" onclick="handleAdd()">+</button>
        <button type="button" onclick="handleSubtract()">-</button>
        <button type="button" onclick="handleDivide()">/</button>
        <button type="button" onclick="handleMultiply()">*</button><br><br><br>
        <button type="button" onclick="submitForm()">Submit</button>


    </form>

    <script type="module" src="./index.js"></script>
</body>
</html>
